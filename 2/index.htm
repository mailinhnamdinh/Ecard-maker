            <script>
                function ShowChiTietDoiTuong_ChungNhanBaoHiem(Canva_ID,Rong0,Cao0)		
                {                
    			    var c = document.getElementById(Canva_ID);
                    var ctx = c.getContext("2d");
                    ctx.clearRect(0, 0, c.width, c.height);
                    var Size = 14;
                    var TyLe =1;
                    var LeTrai = 110*TyLe;
                    var LeTren = 60*TyLe;
                    var Rong = Rong0*TyLe;
                    var Cao = Cao0*TyLe;
                    
                    var Vien = 5*TyLe;
                    var KhoangCachGiua = 50*TyLe;
                    
                    ctx.fillStyle = "red";
                    ctx.font="bold " + parseInt(Rong0/300*Size*TyLe) + "px MainFont";
                    ctx.textAlign = "center";
                    
                    
                    var base_image = new Image();
                    base_image.setAttribute('crossOrigin', 'anonymous');
                    base_image.onload = function()
                    {
                        ctx.drawImage(base_image, 0, 0,Rong,Cao);
                        var X1=Rong/2 + Rong0*52/300*TyLe;
                        var Y1= Cao * 0.6;
                        //ctx.fillStyle = "black";
                        //ctx.fillText($('#HoVaTen').val().toUpperCase(), X1+1, Y1+1);
                        //ctx.fillStyle = "red";
                        ctx.fillText($('#HoVaTen').val().toUpperCase(), X1, Y1);
                        
                        ctx.font="bold " + parseInt((Rong0*Size/300 - Rong0/80)*TyLe) + "px MainFont";
                        //ctx.fillStyle = "black";
                        //ctx.fillText($('#SoDienThoai').val(), X1+Rong0/900, Y1 + Rong0*17/300*TyLe+Rong0/900);
                        //ctx.fillStyle = "red";
                        ctx.fillText($('#SoDienThoai').val(), X1, Y1 + Rong0*17/300*TyLe);
                        
                    }
                    base_image.src = 'card.jpg?vesion=3';
                    
                    
                        
                }
                ShowChiTietDoiTuong_ChungNhanBaoHiem('GiayChungNhan_Img',900,554);
                ShowChiTietDoiTuong_ChungNhanBaoHiem('GiayChungNhan_Img2',300,184.6667);
